name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check Rust formatting
        run: |
          cd src-tauri
          cargo fmt --check

      - name: Clippy
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: Build Rust
        run: |
          cd src-tauri
          cargo build

      - name: Build CLI
        run: |
          cd src-tauri
          cargo build --bin burd

      - name: Run tests
        run: |
          cd src-tauri
          cargo test

      - name: Native service smoke test
        run: |
          brew list redis >/dev/null 2>&1 || brew install redis
          cd src-tauri
          BURD_TEST_REDIS_BINARY="$(brew --prefix redis)/bin/redis-server" cargo test --test native_lifecycle -- --ignored

      - name: Check Svelte
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Install browser test runner
        run: |
          npm install --no-save agent-browser
          npx agent-browser install
      - name: Test browser interactions
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/burd-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl -sf http://127.0.0.1:1420/ > /dev/null && break
            sleep 1
          done
          export PATH="$PWD/node_modules/.bin:$PATH"
          npm run test:ui
